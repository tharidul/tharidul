<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="880" height="400" rx="32" fill="#F5F5F7"/><text x="48" y="62" font-size="12" fill="#0F6A91" font-weight="700" text-anchor="start" letter-spacing="2.2">ABOUT ME</text><text x="48" y="108" font-size="32" fill="#1D1D1F" font-weight="700" text-anchor="start" letter-spacing="-0.8">Building digital solutions</text><text x="48" y="148" font-size="32" fill="#1D1D1F" font-weight="700" text-anchor="start" letter-spacing="-0.8">that make an impact.</text><text x="48" y="196" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">I build things people in Sri Lanka actually use:</text><text x="48" y="221" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">Bodimak.lk for finding boarding rooms and CraftOzen for</text><text x="48" y="246" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">independent sellers. I also write about whatever I'm</text><text x="48" y="271" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">figuring out: prompt engineering, Linux security, and</text><text x="48" y="296" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">OOP concepts without the textbook tone. Mostly, I like</text><text x="48" y="321" font-size="15" fill="#6E6E73" font-weight="400" text-anchor="start">problems that have real users on the other end.</text><rect x="560" y="40" width="272" height="320" rx="24" fill="#FFFFFF"/><text x="584" y="86" font-size="11" fill="#6E6E73" font-weight="600" text-anchor="start" letter-spacing="1.6">LOCATION</text><text x="584" y="108" font-size="14" fill="#1D1D1F" font-weight="600" text-anchor="start">Sri Lanka</text><text x="584" y="154" font-size="11" fill="#6E6E73" font-weight="600" text-anchor="start" letter-spacing="1.6">ROLE</text><text x="584" y="176" font-size="14" fill="#1D1D1F" font-weight="600" text-anchor="start">Full Stack Software Engineer</text><text x="584" y="222" font-size="11" fill="#6E6E73" font-weight="600" text-anchor="start" letter-spacing="1.6">FOCUS</text><text x="584" y="244" font-size="13" fill="#1D1D1F" font-weight="600" text-anchor="start">Web apps, microservices &amp; cloud</text><text x="584" y="290" font-size="11" fill="#6E6E73" font-weight="600" text-anchor="start" letter-spacing="1.6">CONTACT</text><text x="584" y="312" font-size="14" fill="#1D1D1F" font-weight="600" text-anchor="start">tharidulakmal.info@gmail.com</text></svg>